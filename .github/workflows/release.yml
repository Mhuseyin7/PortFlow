name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux,   goarch: amd64, ext: ""    }
          - { os: ubuntu-latest, goos: linux,   goarch: arm64, ext: ""    }
          - { os: macos-latest,  goos: darwin,  goarch: amd64, ext: ""    }
          - { os: macos-latest,  goos: darwin,  goarch: arm64, ext: ""    }
          - { os: windows-latest,goos: windows, goarch: amd64, ext: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go mod tidy
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::7}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "portflow-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: portflow-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
